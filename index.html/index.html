<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Men's Tennis Officiating Rules Test</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            line-height: 1.6;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 {
            color: #004d40;
            text-align: center;
            border-bottom: 2px solid #004d40;
            padding-bottom: 10px;
        }
        .question-block {
            margin-bottom: 25px;
            padding: 15px;
            border-radius: 5px;
            background-color: #fafafa;
            border-left: 4px solid #00796b;
        }
        .question-text {
            font-weight: bold;
            font-size: 1.1em;
            margin-bottom: 10px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            cursor: pointer;
        }
        input[type="radio"] {
            margin-right: 10px;
        }
        .submit-btn {
            display: block;
            width: 100%;
            padding: 15px;
            background-color: #00796b;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1.2em;
            cursor: pointer;
            transition: background 0.3s;
        }
        .submit-btn:hover {
            background-color: #004d40;
        }
        .submit-btn:disabled {
            background-color: #757575;
            cursor: not-allowed;
        }
        .source-box {
            display: none;
            margin-top: 15px;
            padding: 10px;
            background-color: #e0f2f1;
            border-left: 4px solid #004d40;
            font-style: italic;
            font-size: 0.95em;
        }
        #results-summary {
            display: none;
            text-align: center;
            margin-top: 20px;
            padding: 20px;
            background-color: #e8f5e9;
            border-radius: 5px;
            font-size: 1.5em;
            font-weight: bold;
        }
        .success-msg {
            display: block;
            font-size: 0.6em;
            font-weight: normal;
            color: #2e7d32;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Men's Tennis Officiating Rules Test</h1>
    <p>Please answer all 20 questions below. Upon submission, your score will be calculated and the rule sources will be revealed.</p>
    
    <div style="margin-bottom: 20px;">
        <label for="candidateName"><strong>Candidate Name:</strong></label>
        <input type="text" id="candidateName" placeholder="Enter your full name" style="width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px;" required>
    </div>

    <form id="quizForm">
        <div id="quiz-container"></div>
        <button type="submit" class="submit-btn" id="submitBtn">Submit & View Answers</button>
    </form>

    <div id="results-summary"></div>
</div>

<script>
    // The exact same 20 questions
    const questions = [
        { q: "1. How many authorised toilet breaks is a player allowed in a Men's Singles match?", options: ["1 break per match", "2 breaks per match", "1 break per set"], answer: 0, source: "Source: 2025 Modification of Play. In a Men's Singles match each player is entitled to one (1) break." },
        { q: "2. How many authorised toilet breaks are allowed per team in a Men's Doubles match?", options: ["2 breaks per team", "1 break per team", "1 break per player"], answer: 1, source: "Source: 2025 Modification of Play. In Doubles matches, each team is entitled to a total of one (1) break." },
        { q: "3. When can a player in a WTT Men's match leave the court for an authorised toilet break?", options: ["At any change of ends", "Must be taken on a set break", "Before their own serve"], answer: 1, source: "Source: 2026 Toilet Break Summary. A toilet break for WTT Men must be taken on a set break." },
        { q: "4. Where should a male player change his shirt, socks, and shoes during a match?", options: ["In the locker room during a set break", "On court", "In the toilet during a changeover"], answer: 1, source: "Source: 2025 Modification of Play. Shirts, socks and shoes should be changed on court. Players will only be allowed to leave the court on a set break to change wet shorts or underwear." },
        { q: "5. In WTT Men's, what is the penalty if a player takes an additional toilet break (on their 'own time') and exceeds the allowed time?", options: ["Point Penalty Schedule (Delay of Game)", "Back-to-back Time Violations", "Immediate Default"], answer: 1, source: "Source: 2026 Toilet Break Summary. If a player is on their 'own time' and exceeds the allowed time, they will be penalised with back-to-back Time Violations." },
        { q: "6. What are the manufacturer and commercial identification limits for a cap or headband for men?", options: ["2 manufacturer identifications of 26 cm²", "1 manufacturer identification of 26 cm² and 1 commercial identification of 26 cm²", "No commercial identifications are allowed"], answer: 1, source: "Source: Dress & Equipment Men's (FRA). Men are allowed 1 manufacturer ID of 26 cm² and 1 commercial ID of 26 cm² positioned on the side of the head." },
        { q: "7. On a male player's shorts, what is the maximum size allowed if he has two manufacturer identifications placed one in front and one in back?", options: ["13 cm² each", "26 cm² each", "39 cm² each"], answer: 1, source: "Source: Dress & Equipment Men's (FRA). A male player may have 2 identifications of the manufacturer of 26 cm², one placed in front and the other in back." },
        { q: "8. How many zones for identifications are allowed on each sleeve of a male player's shirt?", options: ["1 zone measuring 39 cm²", "2 zones measuring 39 cm² each", "3 zones measuring 26 cm² each"], answer: 1, source: "Source: Dress & Equipment Men's (FRA). Men's sleeves may have 2 zones measuring 39 cm² each for manufacturer and/or commercial identifications on each sleeve." },
        { q: "9. During a heat rule break, when are players allowed to approach their coach and engage in a conversation?", options: ["For the final 90 seconds", "For the entire 10-minute break", "They cannot converse with their coach"], answer: 0, source: "Source: 2025 Off-Court Coaching Summary. The players are allowed to approach their coach and engage in a conversation for the final 90 seconds of a heat rule break." },
        { q: "10. Player A leaves the court at a set break for an authorised toilet break. Player B stays on court. Is Player B allowed to approach his coach?", options: ["No, coaching is suspended", "Yes, Player B can approach his coach until Player A returns", "Only for 90 seconds"], answer: 1, source: "Source: 2025 Off-Court Coaching Summary. Yes, Player B can approach their coach until Player A returns to the court." },
        { q: "11. When exactly should the Chair Umpire press the Start of Point (SoP) button?", options: ["As soon as the previous point ends", "When the server is about to start the service motion", "When the receiver is in position"], answer: 1, source: "Source: Start of Point Functionality. The SoP button should be pressed when the server is about to start the service motion, not before and not later." },
        { q: "12. If a player catches their ball toss during the service motion, what should the Chair Umpire do regarding the SoP button?", options: ["Reset the SoP and press it again", "Nothing", "Issue a Time Violation"], answer: 1, source: "Source: Start of Point Functionality. Nothing. By pressing the SoP you have already sent the message... and betting is already suspended." },
        { q: "13. Does the 25-second Serve/Shot Clock apply to a 2nd serve or a Net 1st serve?", options: ["Yes, it applies to all serves", "No, it is only in operation for 1st serves", "It only applies to 2nd serves"], answer: 1, source: "Source: 2026 Serve/Shot Clock Procedures. The Serve/Shot Clock is only in operation for 1st serves. A Net 1st serve and 2nd serves will not have a Serve/Shot Clock." },
        { q: "14. Can the Chair Umpire pause the Serve/Shot Clock for Off Court Coaching?", options: ["Yes, if the coach is giving a long explanation", "No, no extra time is allowed", "Only if the opponent agrees"], answer: 1, source: "Source: 2026 Serve/Shot Clock Procedures. No extra time will be allowed. It is not a valid reason to pause the clock." },
        { q: "15. If a player is cramping and falls on the court, what should the Chair Umpire do while waiting for the physio?", options: ["Help the player stand up and walk to the chair", "Do not attempt to move the player, make them comfortable", "Perform CPR immediately"], answer: 1, source: "Source: On-Court Medical Conditions Guidelines. Do not attempt to move the player. Make the player as comfortable as possible, e.g. by placing a towel under his/her neck." },
        { q: "16. Under Extreme Heat Condition, when is a 10-minute break allowed in a best-of-3 sets Singles match?", options: ["Between the 1st and 2nd sets", "Between the 2nd and 3rd sets if requested", "In the middle of any set"], answer: 1, source: "Source: 2025 Modification of Play. A 10-minute break will be allowed between the second and third sets (in a best of 3 tie-break sets match only) if requested." },
        { q: "17. In a match played without a chair umpire, who is allowed to call foot faults?", options: ["The receiver", "Only the Referee or Official standing on-court", "Any official, even off-court"], answer: 1, source: "Source: Matches played without chair umpires. Foot faults can only be called by the Referee and not by the receiver, provided the official is standing on-court." },
        { q: "18. On a clay court with no chair umpire, what is the decision if players disagree on a ball mark and direction info doesn't help?", options: ["Replay the point", "The original call stands", "The call is automatically ruled 'In'"], answer: 1, source: "Source: Matches played without chair umpires. If this information does not help to locate the mark, the original 'out' call shall stand." },
        { q: "19. If a player is vomiting, lying on the court, and does not appear fully conscious, what should the Chair Umpire do?", options: ["Turn the player's head to the side", "Carry him to the chair", "Call for water to wash his face"], answer: 0, source: "Source: On-Court Medical Conditions Guidelines. The Chair Umpire should not attempt to move him/her; instead, turn the head to the side to prevent aspiration." },
        { q: "20. Does a player receive extra time on the Serve/Shot Clock if they need to use the towel between points?", options: ["Yes, an extra 5 seconds", "No extra time will be allowed", "Yes, but only in the deciding set"], answer: 1, source: "Source: 2026 Serve/Shot Clock Procedures. No extra time will be allowed to reach the towel box or for the use of the towel itself." }
    ];

    const container = document.getElementById("quiz-container");
    const form = document.getElementById("quizForm");
    const submitBtn = document.getElementById("submitBtn");

    // Render questions
    questions.forEach((item, index) => {
        let optionsHtml = item.options.map((opt, i) => `
            <label>
                <input type="radio" name="q${index}" value="${i}" required>
                ${opt}
            </label>
        `).join('');

        let html = `
            <div class="question-block" id="block-${index}">
                <div class="question-text">${item.q}</div>
                ${optionsHtml}
                <div class="source-box" id="source-${index}">
                    <strong>Correct Answer:</strong> ${item.options[item.answer]}<br><br>
                    ${item.source}
                </div>
            </div>
        `;
        container.innerHTML += html;
    });

    // Handle form submission
    form.addEventListener("submit", function(e) {
        e.preventDefault();

        // Change button state
        submitBtn.innerText = "Grading & Sending Email...";
        submitBtn.disabled = true;

        let score = 0;
        let emailBody = "";
        const candidateName = document.getElementById("candidateName").value || "Candidate";

        questions.forEach((item, index) => {
            const selected = document.querySelector(`input[name="q${index}"]:checked`).value;
            const block = document.getElementById(`block-${index}`);
            const sourceBox = document.getElementById(`source-${index}`);

            // Show sources
            sourceBox.style.display = "block";

            // Build email text
            emailBody += `${item.q}\nCandidate Selected: ${item.options[selected]}\nCorrect Answer: ${item.options[item.answer]}\n\n`;

            // Grade visually
            if (parseInt(selected) === item.answer) {
                score++;
                block.style.borderLeftColor = "#2e7d32"; // Green for correct
            } else {
                block.style.borderLeftColor = "#c62828"; // Red for incorrect
            }
        });

        // AJAX API request to send email silently via FormSubmit
        fetch("https://formsubmit.co/ajax/homritiadil@gmail.com", {
            method: "POST",
            headers: {
                'Content-Type': 'application/json',
                'Accept': 'application/json'
            },
            body: JSON.stringify({
                _subject: `New Quiz Result: ${candidateName} - Score: ${score}/20`,
                Candidate_Name: candidateName,
                Total_Score: `${score} out of 20`,
                Answer_Breakdown: emailBody,
                _replyto: "noreply@officiatingquiz.com"
            })
        })
        .then(response => response.json())
        .then(data => {
            // Show success summary to the candidate
            const resultsDiv = document.getElementById("results-summary");
            resultsDiv.style.display = "block";
            resultsDiv.innerHTML = `
                ${candidateName}, your Score: ${score} / 20
                <span class="success-msg">Results have been successfully emailed to the Administrator.</span>
            `;
            submitBtn.style.display = "none";
        })
        .catch(error => {
            alert("Quiz graded, but there was a network error sending the email. Please check your internet connection.");
            submitBtn.innerText = "Submit & View Answers";
            submitBtn.disabled = false;
        });
    });
</script>

</body>
</html>
